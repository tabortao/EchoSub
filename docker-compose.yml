# EchoSub Docker Compose 配置
# 使用云端镜像 + 数据卷持久化
#
# 使用方法：
#   1. 将 /path/to/your/media 改为你的媒体文件夹实际路径
#   2. 修改 ECHOSUB_JWT_SECRET 为一个随机字符串
#   3. docker compose up -d
#
# 媒体目录挂载为读写（上传功能需要写入），如需只读可加 :ro

services:
  echosub:
    image: ghcr.io/yaole/echosub:latest
    container_name: echosub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ECHOSUB_PORT=8080
      - ECHOSUB_DB_PATH=/app/data/echosub.db
      - ECHOSUB_MEDIA_DIR=/media
      - ECHOSUB_JWT_SECRET=please-change-this-secret
      - GIN_MODE=release
    volumes:
      # 媒体目录：将宿主机的媒体文件夹挂载到容器的 /media
      # 注意：这里用读写模式（不加 :ro），因为上传功能需要写入文件
      # 如需只读挂载，改为 /path/to/your/media:/media:ro
      - /path/to/your/media:/media
      # 数据持久化：SQLite 数据库 + 笔记图片
      - echosub-data:/app/data
    # NAS 设备通常无需特殊设备映射；如需硬件解码视频可按需配置

volumes:
  echosub-data:
