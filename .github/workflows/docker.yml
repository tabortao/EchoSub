name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/echosub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # v1.3.9：CI runner 上没有 ECDICT CSV，先下载再构建
      #   - ecdict.csv 太大（~50MB）不进 git，必须在构建前临时下载
      #   - 镜像内 CSV 仍由 Dockerfile 通配符 COPY 拷入（v1.3.9 起容错）
      #   - 国内构建可用 RUN_EC_DICT_MIRROR=cn 切到 gh-proxy 镜像（默认 github 原站）
      - name: Download ECDICT (optional)
        shell: bash
        env:
          RUN_EC_DICT_MIRROR: ${{ vars.RUN_EC_DICT_MIRROR || 'github' }}
        run: |
          set -e
          TARGET="backend/data/dict/ecdict.csv"
          if [ -f "$TARGET" ]; then
            echo "[SKIP] $TARGET already present ($(du -h "$TARGET" | cut -f1))"
            exit 0
          fi
          mkdir -p "$(dirname "$TARGET")"
          URL_BASE="https://github.com/skywind3000/ECDICT/releases/download/1.0.28/ecdict.csv"
          if [ "$RUN_EC_DICT_MIRROR" = "cn" ]; then
            URL="https://gh-proxy.com/${URL_BASE}"
          else
            URL="$URL_BASE"
          fi
          echo "[INFO] Downloading ECDICT from $URL"
          curl -fL --retry 3 -o "$TARGET" "$URL"
          echo "[OK] ECDICT downloaded: $(du -h "$TARGET" | cut -f1)"

      - name: Set up QEMU（多架构支持）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
